name: Publish Libs Sequentially
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  check-commits:
    runs-on: ubuntu-latest
    outputs:
      should-release-libs: ${{ steps.check.outputs.should-release-libs }}
      should-release-components: ${{ steps.check.outputs.should-release-components }}
      should-release-directives: ${{ steps.check.outputs.should-release-directives }}
      should-release-services: ${{ steps.check.outputs.should-release-services }}
      should-release-utils: ${{ steps.check.outputs.should-release-utils }}
      should-release-performance: ${{ steps.check.outputs.should-release-performance }}
      should-release-shared: ${{ steps.check.outputs.should-release-shared }}  
      should-release-pdf-export: ${{ steps.check.outputs.should-release-pdf-export }}  
      should-release-chart: ${{ steps.check.outputs.should-release-chart }}  
      should-release-video: ${{ steps.check.outputs.should-release-video }}  
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verificar commits para mudanças nas bibliotecas
        id: check
        run: |
          echo "========================================"
          echo "ANALISANDO COMMITS"
          echo "========================================"
          echo "Branch: ${{ github.ref }}"
          echo "Before: ${{ github.event.before }}"
          echo "After: ${{ github.event.after }}"
          echo ""

          # Obter todos os commits deste push
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            COMMITS=$(git log --pretty=format:"%s" ${{ github.event.before }}..${{ github.event.after }})
          else
            # Primeiro push para o branch
            COMMITS=$(git log --pretty=format:"%s" ${{ github.event.after }})
          fi

          echo "Commits encontrados:"
          echo "$COMMITS"
          echo ""
          
          # Verificar cada commit para cada biblioteca
          should_release_libs="false"
          should_release_components="false"
          should_release_directives="false"
          should_release_services="false"
          should_release_utils="false"
          should_release_core="false"
          should_release_performance="false"
          should_release_shared="false"
          should_release_pdf_export="false"
          should_release_video="false"
          should_release_chart="false"
          
          while IFS= read -r commit_message; do
            echo "Analisando commit: $commit_message"
            
            # Verificar padrões para cada biblioteca
            if [[ "$commit_message" =~ (feat\(libs\)|fix\(libs\)|refactor\(libs\)|docs\(libs\)|chore\(libs\)|release\(libs\)|test\(libs\)|style\(libs\)|feature\(libs\)) ]]; then
              should_release_libs="true"
              echo "Commit relacionado a libs encontrado"
            fi
            
            if [[ "$commit_message" =~ (feat\(components\)|fix\(components\)|refactor\(components\)|docs\(components\)|chore\(components\)|release\(components\)|test\(components\)|style\(components\)|feature\(components\)) ]]; then
              should_release_components="true"
              echo "Commit relacionado a components encontrado"
            fi
            
            if [[ "$commit_message" =~ (feat\(directives\)|fix\(directives\)|refactor\(directives\)|docs\(directives\)|chore\(directives\)|release\(directives\)|test\(directives\)|style\(directives\)|feature\(directives\)) ]]; then
              should_release_directives="true"
              echo "Commit relacionado a directives encontrado"
            fi
            
            if [[ "$commit_message" =~ (feat\(services\)|fix\(services\)|refactor\(services\)|docs\(services\)|chore\(services\)|release\(services\)|test\(services\)|style\(services\)|feature\(services\)) ]]; then
              should_release_services="true"
              echo "Commit relacionado a services encontrado"
            fi
            
            if [[ "$commit_message" =~ (feat\(utils\)|fix\(utils\)|refactor\(utils\)|docs\(utils\)|chore\(utils\)|release\(utils\)|test\(utils\)|style\(utils\)|feature\(utils\)) ]]; then
              should_release_utils="true"
              echo "Commit relacionado a utils encontrado"
            fi
            
            if [[ "$commit_message" =~ (feat\(core\)|fix\(core\)|refactor\(core\)|docs\(core\)|chore\(core\)|release\(core\)|test\(core\)|style\(core\)|feature\(core\)) ]]; then
              should_release_core="true"
              echo "Commit relacionado a core encontrado"
            fi

            if [[ "$commit_message" =~ (feat\(performance\)|fix\(performance\)|refactor\(performance\)|docs\(performance\)|chore\(performance\)|release\(performance\)|test\(performance\)|style\(performance\)|feature\(performance\)) ]]; then
              should_release_performance="true"
              echo "Commit relacionado a performance encontrado"
            fi
            
            if [[ "$commit_message" =~ (feat\(shared\)|fix\(shared\)|refactor\(shared\)|docs\(shared\)|chore\(shared\)|release\(shared\)|test\(shared\)|style\(shared\)|feature\(shared\)) ]]; then
              should_release_shared="true"
              echo "Commit relacionado a shared encontrado"
            fi

            if [[ "$commit_message" =~ (feat\(pdf\)|fix\(pdf\)|refactor\(pdf\)|docs\(pdf\)|chore\(pdf\)|release\(pdf\)|test\(pdf\)|style\(pdf\)|feature\(pdf\)) ]]; then
              should_release_pdf_export="true"
              echo "Commit relacionado a pdf-export encontrado"
            fi
            if [[ "$commit_message" =~ (feat\(video\)|fix\(video\)|refactor\(video\)|docs\(video\)|chore\(video\)|release\(video\)|test\(video\)|style\(video\)|feature\(video\)) ]]; then
              should_release_video="true"
              echo "Commit relacionado a pdf-export encontrado"
            fi
            if [[ "$commit_message" =~ (feat\(chart\)|fix\(chart\)|refactor\(chart\)|docs\(chart\)|chore\(chart\)|release\(chart\)|test\(chart\)|style\(chart\)|feature\(chart\)) ]]; then
              should_release_chart="true"
              echo "Commit relacionado a chart encontrado"
            fi
          done <<< "$COMMITS"
          
          # Export results
          echo ""
          echo "========================================"
          echo "RESUMO DAS DECISÕES"
          echo "========================================"
          echo "should-release-libs=$should_release_libs" >> $GITHUB_OUTPUT
          echo "libs: $should_release_libs"
          echo "should-release-components=$should_release_components" >> $GITHUB_OUTPUT
          echo "components: $should_release_components"
          echo "should-release-directives=$should_release_directives" >> $GITHUB_OUTPUT
          echo "directives: $should_release_directives"
          echo "should-release-services=$should_release_services" >> $GITHUB_OUTPUT
          echo "services: $should_release_services"
          echo "should-release-utils=$should_release_utils" >> $GITHUB_OUTPUT
          echo "utils: $should_release_utils"
          echo "should-release-core=$should_release_core" >> $GITHUB_OUTPUT
          echo "core: $should_release_core"
          echo "should-release-performance=$should_release_performance" >> $GITHUB_OUTPUT
          echo "performance: $should_release_performance"
          echo "should-release-shared=$should_release_shared" >> $GITHUB_OUTPUT
          echo "shared: $should_release_shared"
          echo "should-release-pdf-export=$should_release_pdf_export" >> $GITHUB_OUTPUT
          echo "pdf-export: $should_release_pdf_export"
          echo "should-release-pdf-export=$should_release_chart" >> $GITHUB_OUTPUT
          echo "pdf-export: $should_release_chart"
          echo "should-release-pdf-export=$should_release_video" >> $GITHUB_OUTPUT
          echo "pdf-export: $should_release_video"
          echo "========================================"

  publish-sequentially:
    runs-on: ubuntu-latest
    needs: check-commits
    if: |
      needs.check-commits.outputs.should-release-core == 'true' ||
      needs.check-commits.outputs.should-release-utils == 'true' ||
      needs.check-commits.outputs.should-release-services == 'true' ||
      needs.check-commits.outputs.should-release-directives == 'true' ||
      needs.check-commits.outputs.should-release-components == 'true' ||
      needs.check-commits.outputs.should-release-performance == 'true' ||
      needs.check-commits.outputs.should-release-libs == 'true' ||
      needs.check-commits.outputs.should-release-shared == 'true' ||
      needs.check-commits.outputs.should-release-pdf-export == 'true' ||
      needs.check-commits.outputs.should-release-video == 'true' ||
      needs.check-commits.outputs.should-release-chart == 'true' 
    
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        library: ['core', 'utils', 'services', 'directives', 'components', 'libs','performance', 'shared', 'pdf-export', 'chart', 'video']
        include:
          - library: 'core'
            condition: ${{ needs.check-commits.outputs.should-release-core }}
            project-path: 'projects/ngx-opalbytes-core'
            build-command: 'npm run build:core'
            test-command: 'echo "No tests for core"'
            release-command: 'cd projects/ngx-opalbytes-core && npx semantic-release'
          
          - library: 'utils'
            condition: ${{ needs.check-commits.outputs.should-release-utils }}
            project-path: 'projects/ngx-opalbytes-utils'
            build-command: 'npm run build:utils'
            test-command: 'npm run test:utils'
            release-command: 'cd projects/ngx-opalbytes-utils && npx semantic-release'
          
          - library: 'services'
            condition: ${{ needs.check-commits.outputs.should-release-services }}
            project-path: 'projects/ngx-opalbytes-services'
            build-command: 'npm run build:services'
            test-command: 'npm run test:services'
            release-command: 'cd projects/ngx-opalbytes-services && npx semantic-release'
          
          - library: 'directives'
            condition: ${{ needs.check-commits.outputs.should-release-directives }}
            project-path: 'projects/ngx-opalbytes-directives'
            build-command: 'npm run build:directives'
            test-command: 'npm run test:directives'
            release-command: 'cd projects/ngx-opalbytes-directives && npx semantic-release'
          
          - library: 'components'
            condition: ${{ needs.check-commits.outputs.should-release-components }}
            project-path: 'projects/ngx-opalbytes-components'
            build-command: 'npm run build:components'
            test-command: 'npm run test:components'
            release-command: 'cd projects/ngx-opalbytes-components && npx semantic-release'

          - library: 'performance'
            condition: ${{ needs.check-commits.outputs.should-release-performance }}
            project-path: 'projects/ngx-opalbytes-performance'
            build-command: 'npm run build:performance'
            test-command: 'npm run test:performance'
            release-command: 'cd projects/ngx-opalbytes-performance && npx semantic-release'

          - library: 'libs'
            condition: ${{ needs.check-commits.outputs.should-release-libs }}
            project-path: '.'
            build-command: 'echo "No build needed for root"'
            test-command: 'echo "No tests for root"'
            release-command: 'npx semantic-release'

          - library: 'shared'
            condition: ${{ needs.check-commits.outputs.should-release-shared }}
            project-path: 'projects/ngx-opalbytes-shared'
            build-command: 'npm run build:shared'
            test-command: 'npm run test:shared'
            release-command: 'cd projects/ngx-opalbytes-shared && npx semantic-release'
          
          - library: 'pdf-export'
            condition: ${{ needs.check-commits.outputs.should-release-pdf-export }}
            project-path: 'projects/ngx-opalbytes-feature-pdf'
            build-command: 'npm run build:pdf'
            test-command: 'npm run test:pdf'
            release-command: 'cd projects/ngx-opalbytes-feature-pdf && npx semantic-release'

          - library: 'video'
            condition: ${{ needs.check-commits.outputs.should-release-video }}
            project-path: 'projects/ngx-opalbytes-video'
            build-command: 'npm run build:video'
            test-command: 'npm run test:video'
            release-command: 'cd projects/ngx-opalbytes-video && npx semantic-release'

          - library: 'chart'
            condition: ${{ needs.check-commits.outputs.should-release-chart }}
            project-path: 'projects/ngx-opalbytes-chart'
            build-command: 'npm run build:chart'
            test-command: 'npm run test:chart'
            release-command: 'cd projects/ngx-opalbytes-chart && npx semantic-release'

    steps:
      - name: Verificar condições do job publish-sequentially
        run: |
          echo "========================================"
          echo "VERIFICAÇÃO DE CONDIÇÕES DO JOB"
          echo "========================================"
          echo "Este job foi EXECUTADO porque pelo menos uma das condições abaixo é 'true':"
          echo ""
          echo "Verificando cada condição:"
          echo "  - should-release-core: ${{ needs.check-commits.outputs.should-release-core }}"
          if [ "${{ needs.check-commits.outputs.should-release-core }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: core será publicado"
          fi
          echo "  - should-release-utils: ${{ needs.check-commits.outputs.should-release-utils }}"
          if [ "${{ needs.check-commits.outputs.should-release-utils }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: utils será publicado"
          fi
          echo "  - should-release-services: ${{ needs.check-commits.outputs.should-release-services }}"
          if [ "${{ needs.check-commits.outputs.should-release-services }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: services será publicado"
          fi
          echo "  - should-release-directives: ${{ needs.check-commits.outputs.should-release-directives }}"
          if [ "${{ needs.check-commits.outputs.should-release-directives }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: directives será publicado"
          fi
          echo "  - should-release-components: ${{ needs.check-commits.outputs.should-release-components }}"
          if [ "${{ needs.check-commits.outputs.should-release-components }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: components será publicado"
          fi
          echo "  - should-release-performance: ${{ needs.check-commits.outputs.should-release-performance }}"
          if [ "${{ needs.check-commits.outputs.should-release-performance }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: performance será publicado"
          fi
          echo "  - should-release-libs: ${{ needs.check-commits.outputs.should-release-libs }}"
          if [ "${{ needs.check-commits.outputs.should-release-libs }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: libs será publicado"
          fi
          echo "  - should-release-shared: ${{ needs.check-commits.outputs.should-release-shared }}"
          if [ "${{ needs.check-commits.outputs.should-release-shared }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: shared será publicado"
          fi
          echo "  - should-release-pdf-export: ${{ needs.check-commits.outputs.should-release-pdf-export }}"
          if [ "${{ needs.check-commits.outputs.should-release-pdf-export }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: pdf-export será publicado"
          fi
          echo "  - should-release-video: ${{ needs.check-commits.outputs.should-release-video }}"
          if [ "${{ needs.check-commits.outputs.should-release-video }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: video será publicado"
          fi
          echo "  - should-release-chart: ${{ needs.check-commits.outputs.should-release-chart }}"
          if [ "${{ needs.check-commits.outputs.should-release-chart }}" = "true" ]; then
            echo "    ✓ CONDIÇÃO VERDADEIRA: chart será publicado"
          fi
          echo ""
          echo "========================================"

      - name: Iniciar processo para ${{ matrix.library }}
        run: |
          echo "========================================"
          echo "PROCESSANDO: ${{ matrix.library }}"
          echo "========================================"
          echo "Condição para ${{ matrix.library }}: ${{ matrix.condition }}"
          echo "========================================"
      
      - name: Verificar se deve publicar
        id: check-release
        run: |
          echo "========================================"
          echo "VERIFICANDO CONDIÇÃO DE RELEASE"
          echo "========================================"
          echo "Library: ${{ matrix.library }}"
          echo "Condition value: ${{ matrix.condition }}"
          echo ""
          if [ "${{ matrix.condition }}" = "true" ]; then
            echo "Biblioteca ${{ matrix.library }} SERÁ PUBLICADA"
            echo "should-release=true" >> $GITHUB_OUTPUT
          else
            echo "PULANDO ${{ matrix.library }} - nenhuma mudança detectada"
            echo "should-release=false" >> $GITHUB_OUTPUT
          fi
          echo "========================================"
      
      - name: Início do checkout
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "========================================"
          echo "INICIANDO CHECKOUT DO REPOSITÓRIO"
          echo "========================================"

      - name: Fazer checkout do repositório
        if: steps.check-release.outputs.should-release == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout concluído
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "Checkout concluído"
          echo "Current directory: $(pwd)"
          echo "========================================"

      - name: Início da configuração do Node.js
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "========================================"
          echo "CONFIGURANDO NODE.JS"
          echo "========================================"

      - name: Configurar Node.js
        if: steps.check-release.outputs.should-release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Node.js configurado
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "Node.js configurado"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "========================================"

      - name: Configurar autenticação NPM
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "========================================"
          echo "CONFIGURANDO AUTENTICAÇÃO NPM"
          echo "========================================"
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "Autenticação NPM configurada"
          echo "========================================"

      - name: Configurar Git
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "========================================"
          echo "CONFIGURANDO GIT"
          echo "========================================"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Git configurado"
          echo "User: $(git config user.name)"
          echo "Email: $(git config user.email)"
          echo "========================================"

      - name: Instalar dependências
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "========================================"
          echo "INSTALANDO DEPENDÊNCIAS"
          echo "========================================"
          npm ci
          echo "Dependências instaladas com sucesso"
          echo "========================================"

      - name: Atualizar repositório
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "========================================"
          echo "ATUALIZANDO REPOSITÓRIO"
          echo "========================================"
          echo "Current branch: $(git branch --show-current)"
          echo "Fetching latest changes from origin main..."
          git fetch origin main
          git checkout main
          git pull origin main
          echo "Repositório atualizado"
          echo "Latest commit: $(git log -1 --oneline)"
          echo "========================================"

      - name: Gerar relatório de métricas
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "Gerando relatório de métricas..."
          npm run metrics:report || echo "Aviso: Algumas métricas falharam, mas continuando..."
          echo "Relatório de métricas gerado"
        continue-on-error: true

      - name: Adicionar métricas ao changelog
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "Adicionando métricas ao changelog..."
          npm run metrics:changelog
          echo "Métricas adicionadas ao changelog"
        continue-on-error: true

      - name: Executar lint em ${{ matrix.library }}
        if: steps.check-release.outputs.should-release == 'true'
        run: |
          echo "========================================"
          echo "EXECUTANDO LINT"
          echo "========================================"
          npm run lint
          echo "Lint concluído com sucesso"
          echo "========================================"

      - name: Executar testes em ${{ matrix.library }}
        if: steps.check-release.outputs.should-release == 'true' && matrix.test-command != 'echo "No tests for root"'
        run: |
          echo "========================================"
          echo "EXECUTANDO TESTES"
          echo "========================================"
          echo "Command: ${{ matrix.test-command }}"
          ${{ matrix.test-command }}
          echo "Testes concluídos com sucesso"
          echo "========================================"

      - name: Fazer build de ${{ matrix.library }}
        if: steps.check-release.outputs.should-release == 'true' && matrix.build-command != 'echo "No build needed for root"'
        run: |
          echo "========================================"
          echo "BUILDING: ${{ matrix.library }}"
          echo "========================================"
          echo "Command: ${{ matrix.build-command }}"
          ${{ matrix.build-command }}
          echo "Build concluído com sucesso"
          echo "========================================"

      - name: Fazer release de ${{ matrix.library }}
        if: steps.check-release.outputs.should-release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "========================================"
          echo "INICIANDO RELEASE: ${{ matrix.library }}"
          echo "========================================"
          echo "Command: ${{ matrix.release-command }}"
          echo "Project path: ${{ matrix.project-path }}"
          echo ""
          ${{ matrix.release-command }}
          echo ""
          echo "RELEASE CONCLUÍDO: ${{ matrix.library }}"
          echo "========================================"

      - name: Upload do relatório de métricas
        if: steps.check-release.outputs.should-release == 'true' && hashFiles('metrics-reports/latest.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report-${{ matrix.library }}
          path: metrics-reports/latest.html
          retention-days: 90