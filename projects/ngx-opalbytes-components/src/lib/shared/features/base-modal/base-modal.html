<div aria-hidden="true" class="modal" tabIndex="0" [class.show]="showModal" (keydown)="onOverlayClick()"
  (click)="onOverlayClick()">
  <div aria-hidden="true" class="modal-dialog" tabIndex="1" [ngClass]="[modalSize, modalClass]"
    (keydown)="$event.stopPropagation()" (click)="$event.stopPropagation()">
    <ng-content />
  </div>
</div>
