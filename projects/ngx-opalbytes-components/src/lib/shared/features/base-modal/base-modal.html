<div
  class="cao-modal-backdrop"
  [class.cao-modal-backdrop--closing]="closing()"
  (mousedown)="onBackdropMouseDown($event)"
  (mouseup)="onBackdropMouseUp($event)"
>
  <div
    class="cao-modal-panel"
    [ngClass]="[modalSize(), panelClass(), modalClass()]"
    [class.cao-modal-panel--closing]="closing()"
    (mousedown)="$event.stopPropagation()"
    (mouseup)="$event.stopPropagation()"
    (animationend)="onAnimationEnd($event)"
  >
    <ng-content />
  </div>
</div>
