<div
  class="flex flex-col py-2 pt-2.25 px-3.75 rounded-card border-b w-46.25 bg-(--color-white)"
  [style.border-color]="kpiData().borderColor">
  <div class="flex w-full justify-end">
    <img class="w-6 h-6 mr-2" [src]="kpiData().icon.src" [alt]="kpiData().icon.alt" />
  </div>
  <div class="flex flex-col pl-1.5">
    <p class="text-2xl" [style.color]="kpiData().textColor">{{ kpiData().value }}</p>
    <h3 class="text-base" [style.color]="kpiData().textColor">{{ kpiData().title }}</h3>
  </div>
</div>
