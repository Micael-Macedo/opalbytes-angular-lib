<div class="form-field input-component" [class.search-mode]="searchMode">
  <div class="input-wrapper" [class.has-leading-icon]="_leadingIcon" [class.has-trailing-icon]="_trailingIcon"
    [class.focused]="isFocused">
    @if (_leadingIcon) { @if (isLucideIcon) {
    <div class="icon">
      <svg [lucideIcon]="_leadingIcon" [style.color]="iconColor"></svg>
    </div>
    } @else {
    <div class="icon">
      <img alt="ícone de início" [src]="_leadingIcon"/>
    </div>
    } } @switch (type) { 
      @case ('textarea') {
    <textarea matTooltip="{{ tooltip }}" matTooltipPosition="above" matTooltipClass="custom-arrow-tooltip" [attr.data-cy]="dataCy"
      [placeholder]="placeholder" [disabled]="isDisabled" [ngClass]="[
          inputClass,
          control?.touched && control?.invalid ? 'invalid' : '',
          control?.touched && control?.valid && control?.value ? 'valid' : ''
        ]" [attr.maxlength]="maxLength"
      [rows]="textareaRows" [mask]="mask" [allowNegativeNumbers]="allowNegativeNumbers" [thousandSeparator]="thousandSeparator" [decimalMarker]="decimalMarker" [separatorLimit]="separatorLimit"
      [(ngModel)]="value" (input)="onInput($event)"
      (focus)="onFocus()" (blur)="onBlur()"></textarea>
    } 
    @default {
    <input matTooltip="{{ tooltip }}" matTooltipPosition="below" matTooltipClass="custom-arrow-tooltip" [attr.data-cy]="dataCy" [type]="type"
      [placeholder]="placeholder" [disabled]="isDisabled" [ngClass]="[
          inputClass,
          control?.touched && control?.invalid ? 'invalid' : '',
          control?.touched && control?.valid && control?.value ? 'valid' : ''
        ]" [attr.maxlength]="maxLength"
      [mask]="mask" [allowNegativeNumbers]="allowNegativeNumbers" [thousandSeparator]="thousandSeparator" [decimalMarker]="decimalMarker" [separatorLimit]="separatorLimit" [(ngModel)]="value" (input)="onInput($event)"
      (change)="onInputChange($event)" (focus)="onFocus()" (blur)="onBlur()" />
    } } @if (_trailingIcon) { @if (isLucideIcon) {
    <div class="icon">
      <svg [lucideIcon]="_trailingIcon" [style.color]="iconColor"></svg>
    </div>
    } @else {
    <div class="icon">
      <img alt="ícone de fim" [src]="_trailingIcon" />
    </div>
    } } 
  </div>
</div>
