<button
  type="button"
  class="base-button"
  matTooltipPosition="below"
  matTooltipClass="custom-arrow-tooltip"
  [matTooltip]="tooltip"
  [matTooltipDisabled]="!tooltip"
  [class.dark-mode]="isDarkMode"
  [class.disabled]="isDisabled"
  [class.loading]="isLoading"
  [disabled]="isDisabled || isLoading"
  [attr.data-cy]="dataCy"
  (click)="onClick()">
  @if (leadingIcon) {
  <span class="leading-icon">
    @if (isLucideIcon) {
    <svg [lucideIcon]="leadingIcon" [style.color]="iconColor" [strokeWidth]="strokeWidthIcon"></svg>
    } @else {
    <img alt="icon" [src]="leadingIcon" />
    }
  </span>
  } {{ buttonText }} @if (trailingIcon) {
  <span class="trailing-icon">
    @if (isLucideIcon) {
    <svg [lucideIcon]="trailingIcon" [style.color]="iconColor" [strokeWidth]="strokeWidthIcon"></svg>
    } @else {
    <img alt="icon" [src]="trailingIcon" />
    }
  </span>
  } @if (isLoading) {
  <span class="loader"></span>
  }
</button>
