<div class="form-field">
  @if (label) {
  <label [for]="internalControl">{{ label }}</label>
  }

  <mat-form-field appearance="outline" class="rnv-autocomplete-mat-form-field autocomplete">
    <div class="input-wrapper" [class.has-leading-icon]="_leadingIcon" [class.has-trailing-icon]="_trailingIcon"
      [class.focused]="isFocused">
      @if (_leadingIcon) { @if (isLucideIcon) {
      <div class="icon">
        <svg [lucideIcon]="_leadingIcon" [style.color]="iconColor"></svg>
      </div>
      } @else {
      <div class="icon">
        <img alt="ícone de início" [src]="_leadingIcon" />
      </div>
      } }
      <input
        type="text"
        matInput
        [placeholder]="placeholder"
        [formControl]="internalControl"
        [matAutocomplete]="auto"
        [attr.data-cy]="dataCy"
        [ngClass]="[
          control?.touched && control?.invalid ? 'invalid' : '',
          control?.touched && control?.valid && control?.value ? 'valid' : ''
        ]"
        (focus)="onFocus()"
        (blur)="onBlur()" />
      @if (_trailingIcon) { @if (isLucideIcon) {
      <div class="icon trailing-icon">
        <svg [lucideIcon]="_trailingIcon" [style.color]="iconColor"></svg>
      </div>
      } @else {
      <div class="icon trailing-icon">
        <img alt="ícone de fim" [src]="_trailingIcon" />
      </div>
      } }
      <mat-autocomplete
        #auto="matAutocomplete"
        autoActiveFirstOption
        [displayWith]="displayFn"
        (optionSelected)="onOptionSelected($event)">
        @for (option of filteredOptions$ | async; track option.id) {
        <mat-option [value]="option" class="option-item">{{ option.nome }} 
          @if(optionIcon){
            @if (isLucideOptionIcon) {
              <svg [lucideIcon]="optionIcon" [style.color]="iconColor"></svg>
            }@else {
              <img alt="" [src]="optionIcon" />
            }
          }
        </mat-option>
        }
      </mat-autocomplete>
    </div>
  </mat-form-field>
</div>
