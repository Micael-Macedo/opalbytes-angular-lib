<div
  class="fixed left-0 top-0 w-64 h-screen bg-sidebar-bg text-sidebar-foreground flex flex-col z-50"
>
  <!-- User Profile -->
  <div class="p-6 border-b border-sidebar-accent">
    <app-user-profile-dropdown />
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 py-4 overflow-y-auto">
    @for (item of sidebarItems(); track item.label; let i = $index) {
      <div *appPermission="item.permissions" class="mb-1">
        @if (item.children && item.children.length > 0) {
          <!-- Menu expansível com subitens -->
          <button
            (click)="toggleExpanded(item.label)"
            [ngClass]="{
              'bg-sidebar-accent text-sidebar-accent-foreground': isExpanded(item.label),
              'text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground':
                !isExpanded(item.label),
            }"
            class="w-full flex items-center justify-between px-6 py-3 text-left font-medium transition-colors rounded-lg"
          >
            <div class="flex items-center">
              <mat-icon class="w-5 h-5 mr-3">{{ item.icon }}</mat-icon>
              {{ item.label }}
            </div>
            <mat-icon
              class="w-4 h-4 transition-transform"
              [class.rotate-90]="isExpanded(item.label)"
            >
              chevron_right
            </mat-icon>
          </button>
          @if (isExpanded(item.label)) {
            <div class="ml-4 mt-1">
              @for (child of item.children; track child.label) {
                <div *appPermission="child.permissions">
                  <button
                    (click)="navigate(child.route)"
                    [ngClass]="{
                      'bg-sidebar-accent text-sidebar-accent-foreground border-r-2 border-primary':
                        isActive(child.route),
                      'text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground':
                        !isActive(child.route),
                    }"
                    class="w-full flex items-center justify-start px-6 py-2 text-left text-sm font-medium transition-colors rounded-lg"
                  >
                    <mat-icon class="w-4 h-4 mr-3">{{ child.icon }}</mat-icon>
                    {{ child.label }}
                  </button>
                </div>
              }
            </div>
          }
        } @else {
          <!-- Item de menu simples -->
          <button
            (click)="navigate(item.route)"
            [ngClass]="{
              'bg-sidebar-accent text-sidebar-accent-foreground border-r-2 border-primary':
                isActive(item.route),
              'text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground':
                !isActive(item.route),
            }"
            class="w-full flex items-center justify-start px-6 py-3 text-left font-medium transition-colors rounded-lg"
          >
            <mat-icon class="w-5 h-5 mr-3">{{ item.icon }}</mat-icon>
            {{ item.label }}
          </button>
        }
      </div>
    }
  </nav>

  <!-- Logout -->
  <div class="p-4 border-t border-sidebar-accent">
    <button
      (click)="handleLogout()"
      class="w-full flex items-center justify-start px-2 py-3 text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground rounded-lg transition-colors"
    >
      <mat-icon class="w-5 h-5 mr-3">logout</mat-icon>
      SAIR
    </button>
    <div class="text-xs text-muted-foreground mt-2 px-2">{{ VERSION }}</div>
  </div>
</div>
