<div class="p-6">
  <h2 class="text-xl font-semibold text-foreground mb-4">{{ data.title }}</h2>
  <p class="text-muted-foreground mb-6">{{ data.message }}</p>
  <div class="flex justify-end gap-3">
    <button
      (click)="onCancel()"
      class="px-4 py-2 border border-border rounded-md hover:bg-muted text-foreground"
    >
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button
      (click)="onConfirm()"
      [class]="
        data.confirmColor === 'danger'
          ? 'px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md'
          : data.confirmColor === 'warning'
            ? 'px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-md'
            : 'px-4 py-2 bg-primary hover:bg-primary/90 text-primary-foreground rounded-md'
      "
    >
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>
</div>
