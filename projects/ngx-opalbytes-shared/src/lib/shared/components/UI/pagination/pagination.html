@if (totalCount() > 0) {
  <div
    class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-6 pt-4 border-t border-border"
  >
    <div class="flex items-center gap-4">
      <div class="text-sm text-muted-foreground">
        Mostrando {{ inicioItem() }} a {{ fimItem() }} de {{ totalCount() }} registros
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-muted-foreground">Itens por página:</span>
        <select
          [value]="itensPorPagina().toString()"
          (change)="setItensPorPagina($event)"
          class="w-16 h-8 text-xs px-2 border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
        >
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>
    @if (totalPages() > 1) {
      <div class="flex items-center gap-2">
        <button
          (click)="paginaAnterior()"
          [disabled]="!hasPrevious()"
          class="px-3 py-1 border border-border rounded-md disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </button>

        @for (page of getPageNumbers(); track page) {
          <button
            (click)="setPaginaAtual(page)"
            [class]="
              page === paginaAtual() ? 'bg-primary text-primary-foreground' : 'border border-border'
            "
            class="px-3 py-1 rounded-md text-xs"
          >
            {{ page }}
          </button>
        }

        <button
          (click)="proximaPagina()"
          [disabled]="!hasNext()"
          class="px-3 py-1 border border-border rounded-md disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </button>
      </div>
    }
  </div>
}
